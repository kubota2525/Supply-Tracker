name: Monthly Supply Data Pull

on:
  schedule:
    - cron: '0 14 18 * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Months of history to fetch'
        required: false
        default: '6'

jobs:
  pull-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run supply tracker
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python supply_tracker.py --months 6
      - name: Commit updated data files
        run: |
          git config user.name "supply-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "Monthly data pull"
          git push
